name: Release

# Linux packages cannot be built from a Windows machine, and a .dmg needs a
# Mac, so each target is built on its own native runner and all of them upload
# into the same GitHub release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The same checks as ci.yml, so an installer is never built from a commit
  # whose tests fail. They run on Linux only: the suite has never run on
  # Windows, and some tests rely on Linux pipe behaviour.
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

  build:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            target: --win
          - name: Linux packages
            os: ubuntu-latest
            target: --linux
          # Apple Silicon only. The app is signed ad-hoc (mac.identity "-" in
          # package.json), not with a Developer ID, and is not notarized, so
          # macOS blocks the first launch until the user clicks Open Anyway.
          # An arm64 app with no signature at all would not start.
          - name: macOS installer (Apple Silicon)
            os: macos-latest
            target: --mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build client and server bundle
        run: npm run build

      # electron-builder creates the release as a draft, so nothing is public
      # until the release is reviewed and published by hand.
      - name: Package and upload
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
